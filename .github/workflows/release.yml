name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 태그와 plugin.json 버전이 다르면 설치되는 버전과 릴리스가 어긋나므로 여기서 멈춘다.
      - name: Check plugin version
        run: |
          version="v$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "plugin.json 버전($version)이 태그($GITHUB_REF_NAME)와 다릅니다."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
